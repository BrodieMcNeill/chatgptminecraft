<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voxel Survival Core</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="crosshair">+</div>
  <div id="hud">
    <div id="hint">Click to capture mouse · WASD move · Space jump · Shift sprint · LMB mine · RMB place · 1–9 select</div>
    <div id="status"></div>
  </div>
  <div id="hotbar"></div>
  <div id="mineBar" class="hidden"><div id="mineFill"></div></div>
  <div id="overlay">
    <div class="panel">
      <h1>Voxel Survival</h1>
      <p>Procedurally generated plains · voxel physics · mining · inventory · placement</p>
      <button id="start">Enter World</button>
      <small>Mouse to look · WASD to move · Space to jump</small>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
